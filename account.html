<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b0a"><title>Account | BETNOVA</title>
<style>
:root{--bg:#090b0a;--panel:#141916;--line:#303a33;--red:#f02d38;--green:#27d17f;--muted:#aab4ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f6f8f6;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:520px;margin:42px auto;padding:0 18px}.brand{font-size:26px;font-weight:900;text-align:center;margin-bottom:26px;letter-spacing:1px}.brand span{color:var(--red)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:24px}.switch{display:flex;background:#0c100d;border-radius:10px;padding:4px;margin-bottom:22px}.switch button{flex:1;border:0;border-radius:8px;padding:11px;background:transparent;color:var(--muted);font-weight:800}.switch button.active{background:var(--red);color:white}h1{font-size:25px;margin:0 0 6px}p{color:var(--muted);margin:0 0 20px}.field{margin:14px 0}.field label{display:block;font-size:13px;color:#cbd4cd;margin-bottom:7px}.field input{width:100%;padding:13px;background:#0c100d;border:1px solid var(--line);border-radius:9px;color:white;font:inherit;outline:none}.field input:focus{border-color:var(--green)}.submit{width:100%;padding:13px;background:var(--red);border:0;border-radius:9px;color:white;font-weight:900;font-size:15px;margin-top:8px;cursor:pointer}.notice{font-size:12px;line-height:1.6;color:var(--muted);margin-top:17px}.status{display:none;padding:12px;border-radius:8px;background:#14251b;color:var(--green);margin-top:14px;font-size:13px;overflow-wrap:anywhere}.status.error{background:#2a1719;color:#ff9ba1}.back{display:block;text-align:center;color:#d9e0db;margin-top:18px;text-decoration:none}
</style></head><body><main class="wrap"><div class="brand">BET<span>NOVA</span></div><section class="panel"><div class="switch"><button id="loginTab" class="active" type="button">Log in</button><button id="registerTab" type="button">Create account</button></div><h1 id="heading">Welcome back</h1><p id="subheading">Sign in securely to your BETNOVA account.</p><form id="accountForm"><div class="field" id="nameField" hidden><label for="fullName">Full name</label><input id="fullName" autocomplete="name" maxlength="80" placeholder="Your full name"></div><div class="field" id="phoneField" hidden><label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel" placeholder="+233"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required placeholder="At least 8 characters"></div><button class="submit" id="submit" type="submit">Log in</button></form><div class="status" id="status" role="status" aria-live="polite"></div><div class="notice">Accounts are secured by Supabase authentication. New accounts receive member access only. Practice credits are non-cash. No deposits, withdrawals or real-money wagering are enabled.</div></section><a class="back" href="index.html">← Back to BETNOVA</a></main>
<script type="module">
import { supabase } from './supabase-client.js';
let mode='login';const $=id=>document.getElementById(id);
function setMode(next){mode=next;const reg=mode==='register';$('loginTab').classList.toggle('active',!reg);$('registerTab').classList.toggle('active',reg);$('heading').textContent=reg?'Create your account':'Welcome back';$('subheading').textContent=reg?'Register for a BETNOVA member account.':'Sign in securely to your BETNOVA account.';$('nameField').hidden=!reg;$('phoneField').hidden=!reg;$('fullName').required=reg;$('submit').textContent=reg?'Create account':'Log in';$('password').autocomplete=reg?'new-password':'current-password';$('status').style.display='none';$('status').classList.remove('error')}
$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');
const params=new URLSearchParams(location.search);if(params.get('mode')==='register')setMode('register');
$('accountForm').onsubmit=async e=>{e.preventDefault();const button=$('submit');button.disabled=true;button.textContent='Please wait…';const email=$('email').value.trim();const password=$('password').value;let result;
try{
 if(mode==='register'){
  result=await supabase.auth.signUp({email,password,options:{data:{full_name:$('fullName').value.trim(),phone:$('phone').value.trim()}}});
  if(result.error)throw result.error;
  $('status').textContent=result.data.session?'Account created. You are signed in.':'Account created. Check your email to confirm your address, then log in.';
 }else{
  result=await supabase.auth.signInWithPassword({email,password});
  if(result.error)throw result.error;
  $('status').textContent='Signed in successfully. Opening your account…';
  setTimeout(()=>location.href='dashboard.html',700);
 }
 $('status').classList.remove('error');$('status').style.display='block';
}catch(err){$('status').textContent=err.message||'Unable to complete account request.';$('status').classList.add('error');$('status').style.display='block'}
finally{button.disabled=false;button.textContent=mode==='register'?'Create account':'Log in'}
};
</script></body></html>
